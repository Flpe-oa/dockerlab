name: Frontend CI

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t react-test -f Dockerfile.dev .

      - name: Run tests
        run: docker run -e CI=true react-test npm test









